<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0078d4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>文件存储 - CloudStorage</title>
    <!-- Socket.IO Client CDN -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="/static/vendor/winuionweb/style.css">
    <link rel="stylesheet" href="/static/Style.css">
    <script src="/static/App.js"></script>
    <script type="importmap">
    {
      "imports": {
        "vue": "/static/vendor/vue.esm-browser.prod.js",
        "mathlive/ssr": "/static/vendor/mathlive-ssr-shim.js",
        "winuionweb": "/static/vendor/winuionweb/index.js"
      }
    }
    </script>
    <script type="module" src="/static/shell.js"></script>
    <style>
        /* WinUI 组件挂载点：让组件直接参与 .toolbar 的 flex 布局 */
        #winui-toolbar { display: contents; }
    </style>
</head>
<body class="app-body">

    <div class="app-shell">
        <!-- 侧边栏（模仿 OneDrive 网页版） -->
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-close" onclick="closeSidebar()" title="关闭菜单">✕</button>
            <div class="brand">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--accent-color)"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/></svg>
                <span class="brand-name">{{ username or '我的云盘' }}</span>
            </div>

            <!-- 全局搜索（桌面端常驻侧边栏，移动端由图标唤起） -->
            <div class="side-search">            <div class="search-box">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="search-input" placeholder="搜索" oninput="handleSearch(this.value)">
                    <button class="clear-search-btn" id="clear-search" onclick="clearSearch()" title="清空搜索" style="display: none;">✕</button>
                </div>
            </div>


            <nav class="side-nav">
                <a class="side-item" data-nav="home" onclick="navTo('home')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span>主页</span>
                </a>
                <a class="side-item active" data-nav="files" onclick="navTo('files')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                    <span>我的文件</span>
                </a>
                <a class="side-item" data-nav="trash" onclick="navTo('trash')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    <span>回收站</span>
                </a>
                {% if is_admin %}
                <a class="side-item" data-nav="admin" onclick="navTo('admin')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
                    <span>管理后台</span>
                </a>
                {% endif %}
            </nav>

            <div class="side-bottom">
                <div class="side-storage">
                    <div class="side-storage-title">存储</div>
                    <div class="side-storage-bar"><i id="storage-fill"></i></div>
                    <div class="side-storage-text" id="storage-text">统计中…</div>
                </div>
                <a class="side-item" onclick="openBackground()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    <span>背景</span>
                </a>
                <a class="side-item" href="/logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 17l1.41-1.41L8.83 13H20v-2H8.83l2.58-2.59L10 7l-5 5 5 5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                    <span>退出登录</span>
                </a>
            </div>
        </aside>

        <!-- 移动端侧边栏遮罩 -->
        <div class="sidebar-mask" id="sidebar-mask" onclick="closeSidebar()"></div>

        <main class="main-pane">
        <div class="container" id="app-container">
        <!-- Top Progress Bar -->
        <div class="progress-bar" id="progress-bar">
            <div class="progress-inner" id="progress-inner"></div>
        </div>

        <!-- Header Controls -->
        <div class="header">
            <button class="btn-icon sidebar-toggle" onclick="toggleSidebar()" title="侧边栏">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>

            <div class="toolbar">
                <div id="winui-toolbar"></div>
                <input type="file" id="file-input" multiple onchange="uploadFiles()" style="display: none;">
                <input type="file" id="bg-input" accept="image/*" style="display: none;" onchange="uploadBackground(this)">
            </div>
        </div>

        <!-- 标题行：路径 -->
        <div class="title-row">
            <nav class="breadcrumb" id="breadcrumb"></nav>
        </div>

        <!-- File List Content Container -->
        <div class="file-list-container view-list" id="file-container">
            <div class="file-header">
                <div class="col-check">
                    <input type="checkbox" id="select-all" title="全选">
                </div>
                <div>
                    <span class="sortable-col" onclick="handleHeaderClick('name')">
                        名称 <span id="sort-icon-name" class="sort-arrow"></span>
                    </span>
                </div>
                <div>
                    <span class="sortable-col" onclick="handleHeaderClick('size')">
                        大小 <span id="sort-icon-size" class="sort-arrow"></span>
                    </span>
                </div>
                <div class="file-time">
                    <span class="sortable-col" onclick="handleHeaderClick('mtime')">
                        修改时间 <span id="sort-icon-mtime" class="sort-arrow"></span>
                    </span>
                </div>
                <div style="text-align: right;">操作</div>
            </div>

            <div class="selection-bar" id="selection-bar">
                <span class="selection-count">已选 <b id="selection-num">0</b> 项</span>
                <span class="selection-actions">
                    <button class="sel-btn" id="sel-delete" onclick="deleteSelected()">删除</button>
                    <button class="sel-btn ghost" onclick="clearSelection()">取消</button>
                </span>
            </div>

            <div id="file-items-wrapper">
                <div class="empty-state">正在同步文件列表...</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="status-bar">
            <span id="status-text">实时连接中...</span>
            <span id="file-count">0 项</span>
        </div>
    </div>

        <!-- 管理后台（同页展示，避免跳转） -->
        <div class="admin-panel" id="admin-panel">
            <iframe id="admin-frame" title="管理后台"></iframe>
        </div>
    </main>
    </div>

        <!-- 共享链接管理 -->
        <div class="modal-mask" id="shares-modal">
            <div class="modal-card">
                <div class="modal-head">
                    <span>共享链接</span>
                    <button class="modal-close" onclick="closeShares()">✕</button>
                </div>
                <div class="modal-body" id="shares-list">加载中…</div>
            </div>
        </div>

        <!-- 个人背景 -->
        <div class="modal-mask" id="bg-modal">
            <div class="modal-card bg-card">
                <div class="modal-head">
                    <span>个人背景</span>
                    <button class="modal-close" onclick="closeBackground()">✕</button>
                </div>
                <div class="modal-body">
                    <p class="bg-tip">上传一张图片作为你的页面背景。<br>这张背景只对你自己可见，其他账号看不到。</p>
                    <div class="bg-actions">
                        <button class="sel-btn accent" onclick="document.getElementById('bg-input').click()">选择图片</button>
                        <button class="sel-btn ghost" onclick="clearBackground()">恢复默认</button>
                    </div>

                    <div class="bg-slider-row">
                        <label>文件区域模糊 <span class="val" id="val-panel">24px</span></label>
                        <input type="range" id="blur-panel" min="0" max="40" step="1" value="24"
                               oninput="onBlurInput('panel', this.value)">
                    </div>

                    <div class="bg-slider-row">
                        <label>背景模糊 <span class="val" id="val-bg">0px</span></label>
                        <input type="range" id="blur-bg" min="0" max="30" step="1" value="0"
                               oninput="onBlurInput('bg', this.value)">
                    </div>
                </div>
            </div>
        </div>

        <!-- 拖拽上传提示层 -->
        <div class="drop-overlay" id="drop-overlay">
            <div class="drop-card">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="var(--accent-color)"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <div class="drop-title">松开鼠标即可上传</div>
                <div class="drop-sub">支持多个文件，文件夹会被忽略</div>
            </div>
        </div>

    <!-- 上传进度弹窗 -->
    <!-- <div id="upload-toast" class="upload-toast hidden">
        <div class="toast-header">
            <span class="toast-title" id="toast-file-name">正在上传文件...</span>
            <button class="toast-close-btn" onclick="cancelUpload()" title="取消/中断上传">✕</button>
        </div>
        <div class="toast-body">
            <div class="toast-progress-bar">
                <div id="toast-progress-inner" class="toast-progress-inner" style="width: 0%;"></div>
            </div>
            <div class="toast-meta">
                <span id="toast-percent">0%</span>
                <span id="toast-speed">0 KB/s</span>
            </div>
        </div>
    </div> -->

    <div id="upload-toast" class="upload-toast hidden">
        <div class="toast-header">
            <span class="toast-title" id="toast-title">正在上传文件 (0/0)</span>
            <button class="toast-close-btn" onclick="cancelAllUploads()" title="全部取消">✕</button>
        </div>
        <!-- 多文件上传卡片容器 -->
        <div id="upload-list-container" class="upload-list-container">
            <!-- 动态生成的单文件上传项 -->
        </div>
    </div>
</body>
</html>
