<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回收站 - CloudStorage</title>
    <link rel="stylesheet" href="/static/Style.css">
    <style>
        body { align-items: flex-start; padding: 32px 20px 60px; }

        .wrap {
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .head h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .head .who { font-size: 13px; color: var(--text-secondary); }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: calc(var(--radius) * 1.5);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
            padding: 8px 16px 16px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 100px 160px 140px;
            gap: 10px;
            align-items: center;
            padding: 10px 6px;
            border-bottom: 1px dashed var(--card-border);
            font-size: 13px;
        }

        .row:last-child { border-bottom: none; }

        .row .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .row .size, .row .time { color: var(--text-secondary); }

        .row .ops { text-align: right; display: flex; gap: 8px; justify-content: flex-end; }

        button {
            padding: 6px 12px;
            font-size: 12.5px;
            border-radius: var(--radius);
            cursor: pointer;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--text-main);
        }

        button:hover { background: var(--hover-bg); }

        button.primary {
            background: var(--accent-color);
            border-color: transparent;
            color: #fff;
            font-weight: 600;
        }

        button.primary:hover { background: var(--accent-hover); }

        button.danger { color: #d13438; border-color: rgba(209, 52, 56, .35); }
        button.danger:hover { background: rgba(209, 52, 56, .1); }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 6px 4px;
        }

        .empty {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
            font-size: 13px;
        }

        @media (max-width: 640px) {
            .row { grid-template-columns: 1fr; gap: 6px; }
            .row .ops { justify-content: flex-start; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="head">
        <h1>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--accent-color)"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            回收站
        </h1>
        <div class="who">
            {{ user['username'] }} · <a href="/">返回文件</a> · <a href="/logout">退出</a>
        </div>
    </div>

    <div class="card">
        <div class="toolbar">
            <span id="summary" style="font-size:12.5px;color:var(--text-secondary);">加载中...</span>
            <button class="danger" id="empty-btn" onclick="emptyTrash()">清空回收站</button>
        </div>
        <div id="list"></div>
    </div>
</div>

<script>
    function formatSize(bytes) {
        if (!bytes) return '0 B';
        const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function formatTime(ts) {
        const d = new Date(ts * 1000);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }

    let items = [];

    async function load() {
        const res = await fetch('/api/trash', { cache: 'no-store' });
        if (res.status === 401) { location.href = '/login?next=/trash'; return; }
        const data = await res.json();
        items = data.items || [];
        render();
    }

    function render() {
        const list = document.getElementById('list');
        const summary = document.getElementById('summary');
        summary.textContent = `共 ${items.length} 个文件，占用 ${formatSize(items.reduce((s, i) => s + i.size, 0))}`;

        if (!items.length) {
            list.innerHTML = '<div class="empty">回收站是空的</div>';
            return;
        }

        list.innerHTML = items.map(item => `
            <div class="row">
                <div class="name" title="${escapeHtml(item.trash)}">${escapeHtml(item.name)}</div>
                <div class="size">${formatSize(item.size)}</div>
                <div class="time">${formatTime(item.mtime)}</div>
                <div class="ops">
                    <button onclick="restore('${encodeURIComponent(item.trash)}')">恢复</button>
                    <button class="danger" onclick="purge('${encodeURIComponent(item.trash)}')">彻底删除</button>
                </div>
            </div>
        `).join('');
    }

    async function restore(encoded) {
        const trash = decodeURIComponent(encoded);
        const res = await fetch('/trash/restore', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trash })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { alert(data.message || '恢复失败'); return; }
        load();
    }

    async function purge(encoded) {
        const trash = decodeURIComponent(encoded);
        if (!confirm(`彻底删除「${trash}」？此操作不可恢复。`)) return;
        const res = await fetch('/trash/purge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trash })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { alert(data.message || '删除失败'); return; }
        load();
    }

    async function emptyTrash() {
        if (!items.length) return;
        if (!confirm(`清空回收站里的 ${items.length} 个文件？此操作不可恢复。`)) return;
        const res = await fetch('/trash/empty', { method: 'POST' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { alert(data.message || '清空失败'); return; }
        load();
    }

    (function theme() {
        var saved = localStorage.getItem('fluent_theme') || 'system';
        var dark = saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();

    load();
</script>
</body>
</html>
