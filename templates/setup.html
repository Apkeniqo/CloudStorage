<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始化 - CloudStorage</title>
    <link rel="stylesheet" href="/static/Style.css">
    <style>
        body { align-items: center; }

        .setup-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: calc(var(--radius) * 1.5);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.15);
            padding: 30px 26px;
        }

        .setup-card h1 {
            margin: 0 0 6px;
            font-size: 19px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setup-card .hint {
            margin: 0 0 18px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .setup-card label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin: 14px 0 6px;
        }

        .setup-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--text-main);
            background: var(--hover-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            outline: none;
        }

        .setup-card input:focus { border-color: var(--accent-color); }

        .setup-card .tip {
            font-size: 11.5px;
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.5;
        }

        .setup-card button {
            width: 100%;
            margin-top: 22px;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: var(--accent-color);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
        }

        .setup-card button:hover { background: var(--accent-hover); }

        .setup-card .error {
            margin-top: 14px;
            font-size: 13px;
            color: #d13438;
        }
    </style>
</head>
<body>
<form class="setup-card" method="post">
    <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--accent-color)"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/></svg>
        初始化 CloudStorage
    </h1>
    <p class="hint">第一次使用，先设置存储位置和管理员账号。保存后服务会自动重启一次。</p>

    <label>存储路径</label>
    <input type="text" name="upload_folder" value="{{ form.upload_folder }}" spellcheck="false">
    <div class="tip">相对路径基于程序目录；也可以填绝对路径，例如 <code>D:\CloudStorage\Files</code>。</div>

    <label>管理员用户名</label>
    <input type="text" name="admin_user" value="{{ form.admin_user }}" autocomplete="username" spellcheck="false">

    <label>管理员密码（至少 6 位）</label>
    <input type="password" name="password" autocomplete="new-password">

    <label>再输入一次密码</label>
    <input type="password" name="confirm" autocomplete="new-password">

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <button type="submit">完成初始化</button>
</form>

<script>
    (function () {
        var saved = localStorage.getItem('fluent_theme') || 'system';
        var dark = saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
</script>
</body>
</html>
