[SERVER]
# 监听地址与端口 ('::' 代表同时支持 IPv4/IPv6 双栈)
host = ::
# 注意：80 / 443 已被运营商封锁，程序启动时会拒绝这两个端口
port = 5000
debug = false

[PATH]
# 存储目录：相对路径基于 server.py 所在目录，也可填绝对路径（如 G:\CloudStorage）
upload_folder = CloudStorage/Files
# 未完成切片的临时目录
temp_dir = uploads_temp

[LIMIT]
# 单次请求体最大限制（MB）
max_content_length_mb = 102400

[CLEANUP]
# 未完成切片的过期停滞时间（秒）
chunk_expire_seconds = 3600
# 后台自动巡检扫描间隔（秒）
cleanup_interval_seconds = 300

[DB]
# SQLite 数据库文件（相对路径基于 server.py 所在目录）
path = CloudStorage/cloudstorage.db

[LOG]
# 日志固定写到项目下的 logs/ 目录
# logs 目录总大小超过这个值就删除最旧的日志（MB）
max_total_mb = 100
# 最多保留天数，0 表示不按时间清理
max_age_days = 30
# 最多保留文件数（含正在写入的那个）
max_files = 20
# 后台检查间隔（秒）
check_interval_seconds = 600

[UPDATE]
# update.py / update.cmd 用这个仓库检查新版本
repo = Apkeniqo/CloudStorage
branch = main
# 私有仓库需要填 GitHub 访问令牌（public 仓库可留空）
token =

[AUTH]
# 是否启用登录（true / false）
enabled = true
# 首次启动自动创建的管理员账号
admin_user = admin
# 管理员初始密码：留空则随机生成并打印到控制台（仅首次建库时使用）
admin_password =
# 会话签名密钥：留空则自动生成并写回本文件，不要提交真实值
secret =
